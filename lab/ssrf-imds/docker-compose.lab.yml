# PentAGI SSRF + IMDS 横向链 测试靶场
# 启动：docker compose -f lab/ssrf-imds/docker-compose.lab.yml up -d --build
# 关闭：docker compose -f lab/ssrf-imds/docker-compose.lab.yml down
services:
  ssrf-app:
    build: ./ssrf-app
    image: lab/ssrf-app:latest
    container_name: lab-ssrf-app
    hostname: ssrf-app
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    depends_on:
      - fake-imds
    ports:
      - "127.0.0.1:18000:8000"
    networks:
      - pentagi-network

  fake-imds:
    build: ./fake-imds
    image: lab/fake-imds:latest
    container_name: lab-fake-imds
    hostname: fake-imds
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    networks:
      - pentagi-network

  internal-s3:
    build: ./internal-s3
    image: lab/internal-s3:latest
    container_name: lab-internal-s3
    hostname: internal-s3
    restart: unless-stopped
    networks:
      - pentagi-network

networks:
  pentagi-network:
    external: true
    name: pentagi-network
